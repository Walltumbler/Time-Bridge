[package]
name = "timebridge"
version = "0.2.0"
description = "Time that keeps going."
edition = "2021"
license = "Apache-2.0"
default-run = "timebridge"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "timebridge_core"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
notify-rust = "4"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4"] }
url = "2"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros"] }
sha2 = "0.11"
subtle = "2"
base64 = "0.23"
png = "0.18"
tower = { version = "0.5", features = ["limit", "util"] }
tower-http = { version = "0.7", features = ["timeout"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_Devices_FunctionDiscovery", "Win32_UI_Shell_PropertiesSystem"] }
winreg = "0.56"

[[bin]]
name = "timebridge"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"
