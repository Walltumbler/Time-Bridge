name: Desktop checks
on: [push, pull_request]
jobs:
  check:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable, pinned 2026-10-08
      - run: npm ci
      - run: npm run audit:public
      - run: npm run release:validate
      - run: npm run extensions:build
      - run: npm run test:sdk
      - run: npm run native:host:debug
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - run: cargo test --locked --manifest-path native-host/Cargo.toml
      - run: cargo build --locked --manifest-path src-tauri/Cargo.toml
