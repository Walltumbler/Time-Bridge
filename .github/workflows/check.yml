name: Desktop checks
on: [push, pull_request]
jobs:
  check:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run audit:public
      - run: npm run extensions:build
      - run: npm run test:sdk
      - run: npm run native:host:debug
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - run: cargo test --locked --manifest-path native-host/Cargo.toml
      - run: cargo build --locked --manifest-path src-tauri/Cargo.toml
