name: Desktop checks
on: [push, pull_request]
jobs:
  check:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable, pinned 2026-10-08
      - run: npm ci
      - run: npm run audit:public
      - run: npm run release:validate
      - run: npm run extensions:build
      - run: npm run test:sdk
      - run: npm run native:host:debug
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - run: cargo test --locked --manifest-path native-host/Cargo.toml
      - run: cargo build --locked --manifest-path src-tauri/Cargo.toml
